[project]
name = "tguf-py"
version = "0.1.0"
description = "Python bindings for tgn.cpp TGUF"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.5"]

[dependency-groups]
dev = [
    "pytest",
    "numpy",
    "torch",
    "nanobind>=2.0.0",
    "scikit-build-core>=0.10",
]
# Used by tools/download_tgb_to_tguf.py (make download-<ds>)
data = [
    "py-tgb",
    "tqdm",
    "pandas==2.2.3",
]

[tool.uv]
managed = true
package = true

[tool.uv.sources]
# CPU torch for local dev only, dependents keep their own torch (CPU or CUDA)
torch = { index = "pytorch-cpu", group = "dev" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
# torch is a build dependency but intentionally not listed: the extension must be built
# against the consumer's torch. Provide it via uv `extra-build-dependencies`
# (`match-runtime = true`), or build with `--no-build-isolation`.
requires = ["scikit-build-core>=0.10", "nanobind>=2.0.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
install.components = ["python_bindings"]
cmake.source-dir = ".."
wheel.packages = ["tguf"]

# Persistent build dir only for the editable dev install (incremental rebuilds),
# wheel builds use a fresh temporary one
[[tool.scikit-build.overrides]]
if.state = "editable"
build-dir = "build/{wheel_tag}"
editable.rebuild = true

[tool.scikit-build.cmake.define]
TGN_BUILD_PYTHON = "ON"
TGN_BUILD_MODELS = "OFF"
TGN_NATIVE_OPTIMIZATIONS = "OFF"

[tool.pytest.ini_options]
addopts = [
    "--capture=no",
    "--color=yes",
    "-vvv",
]
